; ---------------------------------------------------------------------------
; Hardened php.ini for the PHP Security Exercises project (Exercise 01)
; ---------------------------------------------------------------------------
; Why a php.ini AND ini_set()?
;   * Directives marked PHP_INI_SYSTEM (expose_php, disable_functions, ...)
;     can NOT be changed at runtime with ini_set(); they must be set here
;     (or in the web server's own php.ini / pool config).
;   * Directives marked PHP_INI_ALL (display_errors, log_errors, error_log)
;     are ALSO enforced at runtime in private/bootstrap.php, so the app stays
;     safe even if it is started with a different php.ini.
;
; Local development: `php bin/serve.php` passes every directive below to the
; built-in server with -d, so your own php.ini (and its extensions) still loads.
; Production: copy these directives into the server's php.ini / FPM pool.
; ---------------------------------------------------------------------------

; --- Error handling: log everything, show nothing --------------------------
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_reporting = E_ALL
; Relative to the project root (the dev server runs from there).
; bootstrap.php overrides it with an absolute path inside private/logs/.
error_log = private/logs/php_errors.log

; --- Don't advertise the PHP version (removes the X-Powered-By header) ----
expose_php = Off

; --- Block shell-execution functions ---------------------------------------
; Required by the exercise: exec, system, passthru.
; shell_exec, proc_open, popen and pcntl_exec are added because they offer the
; exact same capability (an attacker would just switch to them).
disable_functions = exec,system,passthru,shell_exec,proc_open,popen,pcntl_exec

; --- Other sensible hardening ----------------------------------------------
allow_url_include = Off
allow_url_fopen = Off
file_uploads = Off

; --- Session defaults (Exercise 06) ----------------------------------------
; Also enforced at runtime in private/src/Session.php (defense in depth).
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Strict
